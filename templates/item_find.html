<html>

<head>
  <title>Find lines</title>
</head>

<body>
    <h2>Find lines in the database</h2>

    <p>You can find lines that contain the search word(s) in the name of the line. The search <b>is not case sensitive</b>.</p>

    <form action="/find_item" method="get">
        <p>
        <label for="query">Search word(s)</label>:
        <input type="text" name="query" id="query" value="{{ query }}">
        </p>
        <input type="submit" value="Search with keyword">
    </form>

{% if query %} <!-- if query exists!!-->
<h2>The following lines were found</h2>

<ul>
  {% for item in results %}
  <li><a href="/item/{{ item.id }}">{{ item.linename }}</a></li>
  {% endfor %}
</ul>

{% endif %}

  <p>
  <a href="/">Back to main page</a>
  </p>

</body> 

</html>
